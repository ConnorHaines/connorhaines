name: Scrape Fixtures & Results

on:
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '0 18,21 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix scraper --omit=dev

      - name: Run scraper
        run: node scraper/scrape.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.json fixtures.ics
          git diff --staged --quiet || git commit -m "chore: update fixtures and results"
          git push
