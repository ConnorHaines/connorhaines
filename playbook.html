/* --- shell ------------------------------------------------------------- */
/* dvh, not vh: iOS measures vh against the largest viewport, which parks the
   timeline underneath Safari's address bar. */
html, body, #root { height: 100%; margin: 0; background: #0a0a0a; }
body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
.pb-shell {
  height: 100vh;
  height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
  font-family: 'Barlow', ui-sans-serif, system-ui, sans-serif;
}
.pb-wordmark {
  font-family: 'Bebas Neue', ui-sans-serif, sans-serif;
  font-size: 22px;
  letter-spacing: 0.08em;
  line-height: 1;
}
input, select, button { font-family: inherit; }
/* 16px stops iOS zooming the whole page when a field takes focus */
input[type="text"], input:not([type]), select { font-size: 16px; }
:focus-visible { outline: 2px solid #F5C518; outline-offset: 2px; }
input[type="range"] { accent-color: #F5C518; height: 28px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }

/* --- offline / no-JS fallback ------------------------------------------ */
#pb-fallback {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 32px; text-align: center; color: #888; background: #0a0a0a;
  font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em;
}
